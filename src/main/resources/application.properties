quarkus.http.host=127.0.0.1
quarkus.http.port=8080
quarkus.http.limits.max-body-size=64K
quarkus.log.level=INFO
quarkus.log.category."consulting.tornbergs.directory".min-level=TRACE
quarkus.log.category."consulting.tornbergs.directory".level=INFO
quarkus.log.file.enabled=true
quarkus.log.file.path=logs/directory-provisioning-service.log
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
# Real LDAP requests require HTTPS on this listener.
# Configure HTTPS in config/application.properties. Probe endpoints are disabled by default.
dps.probe-enabled=false
dps.max-concurrent-requests=8
dps.connect-timeout-ms=5000
dps.operation-timeout-ms=5000

# Disable only for local non-TLS test runs. Production validation is enabled.
dps.startup-validation=true
%test.dps.startup-validation=false

# Per-environment target/LDAP/bind settings are mandatory external configuration.
# Payload diagnostics: opt-in and DEBUG/TRACE only; no HTTP headers are captured.
dps.log-request-payload=false
dps.log-request-payload-max-chars=16384
